<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ウィッシュリスト</title>
<meta name="theme-color" content="#e0607e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ウィッシュリスト">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bootLoading" class="loading-state boot-loading">読み込み中…</div>

<!-- ============ ログイン画面 ============ -->
<div id="loginScreen" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-icon">🎁</div>
    <h1>ウィッシュリスト</h1>
    <p class="login-lead">LINEでログインすると、あなただけのリストが使えるようになるよ。</p>
    <button id="lineLoginBtn" class="btn btn-line">LINEでログイン</button>
    <p id="loginError" class="login-error" hidden></p>
  </div>
</div>

<div id="appRoot" hidden>

<header class="app-header">
  <h1>🎁 ウィッシュリスト</h1>
  <div class="header-user">
    <img id="loggedInAvatar" class="header-avatar" alt="" hidden>
    <span id="loggedInName" class="header-user-name"></span>
    <button id="logoutBtn" class="edit-mode-btn">ログアウト</button>
  </div>
</header>

<nav class="section-nav" id="sectionNav">
  <button class="section-tab active" data-section="wishlist">🎁 ほしい物</button>
  <button class="section-tab" data-section="bucketlist">✅ やりたいこと</button>
  <button class="section-tab" data-section="travellist">✈️ 行きたいところ</button>
  <button class="section-tab" data-section="restaurantlist">🍴 行きたい飲食店</button>
  <button class="section-tab" data-section="hotellist">🏨 泊まりたいホテル</button>
  <button class="section-tab" data-section="cafelist">☕ 行きたいカフェ</button>
  <button class="section-tab" data-section="furusatolist">🎁 ふるさと納税</button>
</nav>

<div id="loadingState" class="loading-state">読み込み中…</div>

<!-- ============ ほしい物リスト ============ -->
<section id="section-wishlist" class="app-section" hidden>
  <div id="wishTotal" class="list-total" hidden></div>
  <div id="wishEmptyState" class="empty-state" hidden>まだ何も登録されてないよ。</div>
  <div id="wishGrid" class="card-grid"></div>
</section>

<!-- ============ やりたいことリスト ============ -->
<section id="section-bucketlist" class="app-section" hidden>
  <div id="bucketEmptyState" class="empty-state" hidden>まだ何も登録されてないよ。</div>
  <div id="bucketList" class="simple-list"></div>
</section>

<!-- ============ 行きたいところリスト ============ -->
<section id="section-travellist" class="app-section" hidden>
  <div id="travelEmptyState" class="empty-state" hidden>まだ何も登録されてないよ。</div>
  <div id="travelList" class="simple-list"></div>
</section>

<!-- ============ 行きたい飲食店リスト ============ -->
<section id="section-restaurantlist" class="app-section" hidden>
  <div id="restaurantEmptyState" class="empty-state" hidden>まだ何も登録されてないよ。</div>
  <div id="restaurantList" class="simple-list"></div>
</section>

<!-- ============ 泊まりたいホテルリスト ============ -->
<section id="section-hotellist" class="app-section" hidden>
  <div id="hotelEmptyState" class="empty-state" hidden>まだ何も登録されてないよ。</div>
  <div id="hotelList" class="simple-list"></div>
</section>

<!-- ============ 行きたいカフェリスト ============ -->
<section id="section-cafelist" class="app-section" hidden>
  <div id="cafeEmptyState" class="empty-state" hidden>まだ何も登録されてないよ。</div>
  <div id="cafeList" class="simple-list"></div>
</section>

<!-- ============ ふるさと納税リスト ============ -->
<section id="section-furusatolist" class="app-section" hidden>
  <div id="furusatoTotal" class="list-total" hidden></div>
  <div id="furusatoEmptyState" class="empty-state" hidden>まだ何も登録されてないよ。</div>
  <div id="furusatoList" class="simple-list"></div>
</section>

<!-- ============ ほしい物モーダル ============ -->
<div id="wishModalOverlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="wishModalTitle">ほしい物を追加</h2>
      <button class="icon-btn js-close-wish" aria-label="閉じる">×</button>
    </div>
    <div class="source-tabs" id="wishSourceTabs">
      <button type="button" class="tab active" data-source="rakuten">楽天・Yahoo!で検索</button>
      <button type="button" class="tab" data-source="amazon">Amazon(手動)</button>
      <button type="button" class="tab" data-source="other">その他</button>
    </div>

    <div id="rakutenSearchPanel" class="source-panel">
      <div class="form-row">
        <input type="text" id="rakutenKeyword" placeholder="商品名で検索(例: ワイヤレスイヤホン)">
        <button type="button" id="rakutenSearchBtn" class="btn">検索</button>
      </div>
      <div id="rakutenSearchStatus" class="ocr-status" hidden></div>
      <div id="rakutenResults" class="rakuten-results"></div>
    </div>

    <form id="wishForm" class="source-panel" hidden>
      <input type="hidden" id="wishId">
      <input type="hidden" id="wishSource" value="other">
      <label>商品名(空欄でもOK、URLがあれば自動で名前を付けるよ)
        <input type="text" id="wish_title">
      </label>
      <div class="form-row">
        <label>価格(円)
          <input type="number" id="wish_price" min="0">
        </label>
        <label>画像URL(あれば)
          <input type="text" id="wish_image">
        </label>
      </div>
      <button type="button" id="wishImageSearchBtn" class="btn" style="width:100%; margin-bottom:12px;">🔍 商品名で画像を検索</button>
      <div id="wishImageResults" class="rakuten-results" style="margin-bottom:12px;"></div>
      <label>商品ページのURL
        <input type="text" id="wish_url" placeholder="https://www.amazon.co.jp/...">
      </label>
      <label>メモ
        <textarea id="wish_memo" rows="2"></textarea>
      </label>
      <div class="modal-footer">
        <button type="button" id="deleteWishBtn" class="btn btn-danger" hidden>削除</button>
        <div class="spacer"></div>
        <button type="button" class="btn js-close-wish">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ シンプルリスト共通モーダル(やりたいこと/行きたいところ/飲食店/ホテル/カフェ) ============ -->
<div id="simpleModalOverlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="simpleModalTitle">追加</h2>
      <button class="icon-btn js-close-simple" aria-label="閉じる">×</button>
    </div>
    <form id="simpleForm">
      <input type="hidden" id="simpleId">
      <label>名前 <span class="required">*</span>
        <input type="text" id="simple_title" required>
      </label>
      <label id="simpleAmountLabel" hidden>寄付金額(円)
        <input type="number" id="simple_amount" min="0">
      </label>
      <label>メモ
        <textarea id="simple_memo" rows="2" placeholder="理由・時期など"></textarea>
      </label>
      <label>関連リンク(あれば。地図・予約サイト・Amazon/楽天のリンクなど)
        <input type="text" id="simple_link">
      </label>
      <div class="modal-footer">
        <button type="button" id="deleteSimpleBtn" class="btn btn-danger" hidden>削除</button>
        <div class="spacer"></div>
        <button type="button" class="btn js-close-simple">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

</div>

<script src="auth.js"></script>
<script src="app.js"></script>
<script src="wishlist.js"></script>
<script src="lists.js"></script>
<script>initAuth();</script>
</body>
</html>
